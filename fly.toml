# fly.toml — Fly.io deployment for a ceiba node.
#
# Usage:
#   flyctl launch --copy-config --no-deploy   # creates the app, edits this file
#   flyctl volumes create ceiba_data --size 1
#   flyctl deploy
#
# After deploy, set your custom domain:
#   flyctl certs create your-ceiba.example
#   # add the AAAA record Fly shows you to your DNS, then:
#   flyctl certs check your-ceiba.example
#
# Reference: https://fly.io/docs/python/

app = "your-ceiba"          # ← change this
primary_region = "scl"      # ← pick a region (scl, gru, mia, dfw, ord, ams, ...)

[build]

[env]
  PORT = "8080"
  # Set additional env vars with: flyctl secrets set KEY=value

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "ceiba_data"
  destination = "/app/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[processes]
  app = "uvicorn api.main:app --host 0.0.0.0 --port 8080"
