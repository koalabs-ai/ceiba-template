name: Validate ceiba manifest

on:
  pull_request:
    paths:
      - "ceiba.json"
      - "api/**"
      - "sql/**"
  push:
    branches: [ main ]
    paths:
      - "ceiba.json"
      - "api/**"
      - "sql/**"
  workflow_dispatch: {}

jobs:
  validate:
    name: Schema + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate ceiba.json against the canonical schema
        run: |
          python - <<'PY'
          import json, sys, urllib.request, jsonschema

          req = urllib.request.Request(
              "https://ceiba.to/ceiba.schema.json",
              headers={"User-Agent": "ceiba-template-ci"},
          )
          schema = json.loads(urllib.request.urlopen(req, timeout=15).read())
          manifest = json.loads(open("ceiba.json").read())
          validator = jsonschema.Draft202012Validator(schema)
          errors = sorted(validator.iter_errors(manifest), key=lambda e: tuple(str(p) for p in e.absolute_path))
          if errors:
              print(f"::error::{len(errors)} validation error(s)")
              for e in errors[:10]:
                  path = "/".join(str(p) for p in e.absolute_path) or "(root)"
                  print(f"::error file=ceiba.json::{path}: {e.message[:200]}")
              sys.exit(1)
          print("ceiba.json VALID against v0.5 schema")
          PY

      - name: Install runtime deps + apply schema
        run: |
          pip install -r requirements.txt
          mkdir -p data
          python -c "import sqlite3; c=sqlite3.connect('data/db.sqlite'); c.executescript(open('sql/001_init.sql').read()); c.commit()"

      - name: Boot the server and smoke /health + /.well-known/ceiba.json
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8200 &
          SERVER_PID=$!
          # poll up to ~10s for boot
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8200/health > /dev/null; then break; fi
            sleep 0.5
          done
          set -e
          curl -sf http://127.0.0.1:8200/health | python -m json.tool
          curl -sf http://127.0.0.1:8200/.well-known/ceiba.json | python -c "import sys,json; d=json.load(sys.stdin); assert d['protocol_version']=='0.5', d; print('manifest OK')"
          curl -sf http://127.0.0.1:8200/v1/stats | python -m json.tool
          kill $SERVER_PID
